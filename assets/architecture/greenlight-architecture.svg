<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">GreenLight end-to-end architecture</title>
  <desc id="desc">GitHub change metadata flows through the GreenLight worker and API to a versioned Blnk workload. OpenTelemetry carries traces, metrics, and logs into self-hosted SigNoz, whose Query Builder, dashboards, alerts, and MCP server provide evidence back to GreenLight.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08120f"/>
      <stop offset="0.55" stop-color="#090d14"/>
      <stop offset="1" stop-color="#130b12"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#78e3ad"/>
      <stop offset="1" stop-color="#4fb68b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".38"/>
    </filter>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#6bd6a2"/>
    </marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#7bb9ff"/>
    </marker>
    <marker id="arrow-pink" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#f28ca2"/>
    </marker>
    <style>
      .title { font: 700 44px Inter, ui-sans-serif, system-ui, sans-serif; fill: #f2f6f4; }
      .subtitle { font: 400 19px Inter, ui-sans-serif, system-ui, sans-serif; fill: #a9b6b0; }
      .group { fill: rgba(15,23,25,.75); stroke: #263833; stroke-width: 2; rx: 24; }
      .group-title { font: 700 16px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 2.5px; fill: #8da69c; }
      .node { fill: #111a1d; stroke: #344943; stroke-width: 2; rx: 16; filter: url(#shadow); }
      .node-blue { fill: #101923; stroke: #36516e; }
      .node-pink { fill: #1d1219; stroke: #6a3544; }
      .node-title { font: 700 20px Inter, ui-sans-serif, system-ui, sans-serif; fill: #f1f5f3; }
      .node-copy { font: 400 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #a9b6b0; }
      .badge { font: 700 13px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: .7px; fill: #07100d; }
      .edge-label { font: 600 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #b8c4bf; }
      .legend { font: 500 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #9eada7; }
      .green { stroke: #6bd6a2; }
      .blue { stroke: #7bb9ff; }
      .pink { stroke: #f28ca2; }
      .line { fill: none; stroke-width: 3; marker-end: url(#arrow-green); }
      .telemetry { fill: none; stroke-width: 3; marker-end: url(#arrow-blue); }
      .evidence { fill: none; stroke-width: 3; marker-end: url(#arrow-pink); }
      .optional { stroke-dasharray: 9 8; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <path d="M0 150H1600M0 330H1600M0 510H1600M0 690H1600M0 870H1600M200 0V1000M400 0V1000M600 0V1000M800 0V1000M1000 0V1000M1200 0V1000M1400 0V1000"
        stroke="#24312d" stroke-opacity=".24"/>

  <text x="72" y="72" class="title">GreenLight: AI change flight recorder</text>
  <text x="72" y="108" class="subtitle">Every receipt is assembled from resolvable change, CI, deployment, and SigNoz evidence.</text>
  <rect x="1315" y="54" width="213" height="40" rx="20" fill="url(#accent)"/>
  <text x="1421" y="79" text-anchor="middle" class="badge">TRACK 3 · BUILD YOUR OWN</text>

  <rect class="group" x="55" y="160" width="300" height="650"/>
  <text x="82" y="196" class="group-title">CHANGE SOURCES</text>
  <rect class="node" x="82" y="230" width="246" height="116"/>
  <text x="105" y="269" class="node-title">Claude Code</text>
  <text x="105" y="299" class="node-copy">Optional session trace</text>
  <text x="105" y="323" class="node-copy">not linked in recorded run</text>
  <rect class="node" x="82" y="420" width="246" height="116"/>
  <text x="105" y="459" class="node-title">GitHub</text>
  <text x="105" y="489" class="node-copy">Commit + Actions timing</text>
  <text x="105" y="513" class="node-copy">immutable commit SHA</text>
  <rect class="node" x="82" y="610" width="246" height="132"/>
  <text x="105" y="649" class="node-title">Recorded chain</text>
  <text x="105" y="679" class="node-copy">baseline → candidate</text>
  <text x="105" y="703" class="node-copy">→ verified recovery</text>

  <rect class="group" x="405" y="160" width="380" height="650"/>
  <text x="432" y="196" class="group-title">GREENLIGHT</text>
  <rect class="node" x="432" y="230" width="326" height="104"/>
  <text x="458" y="271" class="node-title">React evidence UI</text>
  <text x="458" y="301" class="node-copy">Overview, change log, receipts</text>
  <rect class="node" x="432" y="390" width="326" height="104"/>
  <text x="458" y="431" class="node-title">Fastify API</text>
  <text x="458" y="461" class="node-copy">Receipt + evidence resolver</text>
  <rect class="node" x="432" y="550" width="326" height="104"/>
  <text x="458" y="591" class="node-title">Background worker</text>
  <text x="458" y="621" class="node-copy">Sync, deploy, measure, decide</text>
  <rect class="node" x="432" y="706" width="326" height="74"/>
  <text x="458" y="751" class="node-title">PostgreSQL</text>

  <rect class="group" x="835" y="160" width="300" height="650"/>
  <text x="862" y="196" class="group-title">MONITORED WORKLOAD</text>
  <rect class="node node-blue" x="862" y="230" width="246" height="132"/>
  <text x="887" y="270" class="node-title">Blnk v0.15.1</text>
  <text x="887" y="300" class="node-copy">Apache-2.0 ledger</text>
  <text x="887" y="324" class="node-copy">service.version = SHA</text>
  <rect class="node node-blue" x="862" y="450" width="246" height="90"/>
  <text x="887" y="505" class="node-title">Blnk PostgreSQL</text>
  <rect class="node node-blue" x="862" y="610" width="246" height="90"/>
  <text x="887" y="665" class="node-title">Blnk Redis</text>

  <rect class="group" x="1185" y="160" width="360" height="650"/>
  <text x="1212" y="196" class="group-title">SELF-HOSTED SIGNOZ</text>
  <rect class="node node-pink" x="1212" y="230" width="306" height="104"/>
  <text x="1238" y="271" class="node-title">OTel Collector</text>
  <text x="1238" y="301" class="node-copy">OTLP traces · metrics · logs</text>
  <rect class="node node-pink" x="1212" y="390" width="306" height="116"/>
  <text x="1238" y="431" class="node-title">SigNoz v0.134.0</text>
  <text x="1238" y="461" class="node-copy">Query Builder v5, dashboards,</text>
  <text x="1238" y="485" class="node-copy">alerts, traces, and logs</text>
  <rect class="node node-pink" x="1212" y="562" width="306" height="92"/>
  <text x="1238" y="602" class="node-title">SigNoz MCP v0.9.0</text>
  <text x="1238" y="630" class="node-copy">agent-native investigation</text>
  <rect class="node node-pink" x="1212" y="710" width="306" height="74"/>
  <text x="1238" y="755" class="node-title">Alert history + webhook</text>

  <path class="line green optional" d="M205 346V420"/>
  <text x="218" y="388" class="edge-label">AI-Traceparent</text>
  <path class="line green" d="M328 478C380 478 380 602 432 602"/>
  <text x="356" y="551" text-anchor="middle" class="edge-label">REST metadata</text>
  <path class="line green" d="M595 334V390"/>
  <path class="line green" d="M595 494V550"/>
  <path class="line green" d="M595 654V706"/>
  <path class="line green" d="M758 602C810 602 810 296 862 296"/>
  <text x="810" y="435" text-anchor="middle" class="edge-label">deploy SHA</text>
  <path class="line green" d="M985 362V450"/>
  <path class="line green" d="M985 540V610"/>

  <path class="telemetry blue" d="M758 282C980 282 990 282 1212 282"/>
  <path class="telemetry blue" d="M758 442C980 442 990 310 1212 310"/>
  <path class="telemetry blue" d="M758 622C980 622 990 298 1212 298"/>
  <path class="telemetry blue" d="M1108 296C1155 296 1165 296 1212 296"/>
  <text x="1002" y="252" text-anchor="middle" class="edge-label">OTLP telemetry</text>
  <path class="telemetry blue" d="M1365 334V390"/>

  <path class="evidence pink" d="M1212 448C1030 448 940 442 758 442"/>
  <text x="984" y="430" text-anchor="middle" class="edge-label">Query Builder evidence</text>
  <path class="evidence pink" d="M1212 608C1050 608 918 602 758 602"/>
  <text x="985" y="592" text-anchor="middle" class="edge-label">MCP investigation</text>
  <path class="evidence pink" d="M1365 506V562"/>
  <path class="evidence pink" d="M1365 654V710"/>
  <path class="evidence pink optional" d="M1212 747C1015 747 955 468 758 468"/>
  <text x="1003" y="724" text-anchor="middle" class="edge-label">webhook delivery not observed</text>

  <line x1="70" y1="878" x2="115" y2="878" class="green" stroke-width="4"/>
  <text x="128" y="884" class="legend">change and control flow</text>
  <line x1="382" y1="878" x2="427" y2="878" class="blue" stroke-width="4"/>
  <text x="440" y="884" class="legend">OpenTelemetry</text>
  <line x1="650" y1="878" x2="695" y2="878" class="pink" stroke-width="4"/>
  <text x="708" y="884" class="legend">SigNoz evidence</text>
  <line x1="958" y1="878" x2="1003" y2="878" class="green optional" stroke-width="4"/>
  <text x="1016" y="884" class="legend">optional / not observed</text>

  <rect x="55" y="920" width="1490" height="2" fill="#263833"/>
  <text x="55" y="958" class="legend">Truth boundary: GreenLight reports version correlation, never causation. The recorded run intentionally shows the AI link as missing.</text>
</svg>
