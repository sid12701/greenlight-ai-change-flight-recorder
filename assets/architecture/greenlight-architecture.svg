          <text x="380.79999999999995" y="1316" font-size="14.5" fill="#8397a0">OpenTelemetry ingest</text><line x1="576.8" y1="1311" x2="610.8" y2="1311" stroke="#f472b6" stroke-width="3"></line>
          <text x="622.8" y="1316" font-size="14.5" fill="#8397a0">SigNoz evidence returned</text><line x1="849.1999999999999" y1="1311" x2="883.1999999999999" y2="1311" stroke="#6b7f88" stroke-width="3"></line>
          <text x="895.1999999999999" y="1316" font-size="14.5" fill="#8397a0">optional / not observed</text><text x="1858" y="1316" font-size="14.5" fill="#5d7079" text-anchor="end">Blnk is Apache-2.0 and knows nothing about GreenLight.</text></svg>
