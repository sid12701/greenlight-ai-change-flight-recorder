          <path d="M0,0 L11,4.5 L0,9 z" fill="#6b7f88"></path></marker></defs><rect width="1920" height="1360" fill="#05090b"></rect>
<text x="70" y="68" font-size="41" font-weight="800" fill="#eef4f6" letter-spacing="-.7">GreenLight — how one change becomes evidence</text>
<text x="70" y="99" font-size="19" fill="#8397a0">Every arrow is a real call in the recorded run. Time runs downward; no arrow skips a step.</text>
<rect x="1560" y="42" width="292" height="34" rx="17" fill="#34d399"></rect>
<text x="1706" y="64" font-size="14" font-weight="800" fill="#08160f" letter-spacing="1" text-anchor="middle">TRACK 3 · BUILD YOUR OWN</text><rect x="62" y="212" width="1796" height="262" rx="14" fill="#0a1116" stroke="#18242b"></rect>
          <text x="88" y="239" font-size="13" font-weight="800" letter-spacing="1.8" fill="#5d7079">1 · RECORD THE CHANGE</text><rect x="62" y="492" width="1796" height="262" rx="14" fill="#0a1116" stroke="#18242b"></rect>
          <text x="88" y="519" font-size="13" font-weight="800" letter-spacing="1.8" fill="#5d7079">2 · DEPLOY AND OBSERVE</text><rect x="62" y="772" width="1796" height="394" rx="14" fill="#0a1116" stroke="#18242b"></rect>
          <text x="88" y="799" font-size="13" font-weight="800" letter-spacing="1.8" fill="#5d7079">3 · MEASURE AND DECIDE</text>
  <rect x="93" y="116" width="238" height="76" rx="12" fill="#101a20" stroke="#26343d" stroke-width="1"></rect>
  <text x="212" y="148" font-size="19" font-weight="700" fill="#eef4f6" text-anchor="middle">Claude Code</text>
  <text x="212" y="171" font-size="13.5" fill="#7f939c" text-anchor="middle">coding session</text>
  <line x1="212" y1="192" x2="212" y2="1244" stroke="#1c2830" stroke-width="2" stroke-dasharray="5 6"></line>
  <rect x="451" y="116" width="238" height="76" rx="12" fill="#101a20" stroke="#26343d" stroke-width="1"></rect>
  <text x="570" y="148" font-size="19" font-weight="700" fill="#eef4f6" text-anchor="middle">GitHub</text>
  <text x="570" y="171" font-size="13.5" fill="#7f939c" text-anchor="middle">commit + Actions run</text>
  <line x1="570" y1="192" x2="570" y2="1244" stroke="#1c2830" stroke-width="2" stroke-dasharray="5 6"></line>
  <rect x="829" y="116" width="266" height="76" rx="12" fill="#0f2019" stroke="#34d399" stroke-width="1.7"></rect>
  <text x="962" y="148" font-size="19" font-weight="700" fill="#5eead4" text-anchor="middle">GreenLight</text>
  <text x="962" y="171" font-size="13.5" fill="#7f939c" text-anchor="middle">API · worker · receipt</text>
  <line x1="962" y1="192" x2="962" y2="1244" stroke="#2a4d41" stroke-width="2.6"></line>
  <rect x="1239" y="116" width="238" height="76" rx="12" fill="#101a20" stroke="#26343d" stroke-width="1"></rect>
  <text x="1358" y="148" font-size="19" font-weight="700" fill="#eef4f6" text-anchor="middle">Blnk v0.15.1</text>
  <text x="1358" y="171" font-size="13.5" fill="#7f939c" text-anchor="middle">third-party workload</text>
  <line x1="1358" y1="192" x2="1358" y2="1244" stroke="#1c2830" stroke-width="2" stroke-dasharray="5 6"></line>
  <rect x="1624" y="116" width="236" height="76" rx="12" fill="#111a2b" stroke="#60a5fa" stroke-width="1.7"></rect>
  <text x="1742" y="148" font-size="19" font-weight="700" fill="#93c5fd" text-anchor="middle">SigNoz</text>
  <text x="1742" y="171" font-size="13.5" fill="#7f939c" text-anchor="middle">self-hosted · v0.134.0</text>
  <line x1="1742" y1="192" x2="1742" y2="1244" stroke="#2b3f5e" stroke-width="2.6"></line><line x1="218" y1="308" x2="561" y2="308" stroke="#6b7f88" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#amute)"></line><text x="222" y="281" font-size="17" font-weight="600" fill="#9fb0b8">
            <tspan font-size="12.5" font-weight="800" fill="#5d7079">01</tspan>
            <tspan dx="12">AI-Traceparent git trailer</tspan></text><text x="248" y="300" font-size="13.5" fill="#7f939c">optional — reads “not linked” in the recorded run</text><line x1="576" y1="374" x2="953" y2="374" stroke="#34d399" stroke-width="2.4" marker-end="url(#agreen)"></line><text x="580" y="347" font-size="17" font-weight="600" fill="#dce6ea">
            <tspan font-size="12.5" font-weight="800" fill="#5d7079">02</tspan>
            <tspan dx="12">commit, branch and CI run metadata</tspan></text><text x="606" y="366" font-size="13.5" fill="#7f939c">GitHub REST — the run that approved this exact SHA</text><rect x="956" y="394" width="789" height="60" rx="10" fill="#34d3990f" stroke="#34d39947"></rect><line x1="968" y1="440" x2="1733" y2="440" stroke="#34d399" stroke-width="3.2" marker-end="url(#agreen)"></line><text x="972" y="413" font-size="17" font-weight="600" fill="#dce6ea">
            <tspan font-size="12.5" font-weight="800" fill="#5d7079">03</tspan>
            <tspan dx="12">CI run reconstructed as OpenTelemetry spans</tspan><tspan dx="8" fill="#34d399">★</tspan></text><text x="998" y="432" font-size="13.5" fill="#7f939c">GitHub Actions is not a native SigNoz source — this is the bridge</text><line x1="968" y1="588" x2="1349" y2="588" stroke="#34d399" stroke-width="2.4" marker-end="url(#agreen)"></line><text x="972" y="561" font-size="17" font-weight="600" fill="#dce6ea">
            <tspan font-size="12.5" font-weight="800" fill="#5d7079">04</tspan>
            <tspan dx="12">deploy the commit as an immutable service.version</tspan></text><text x="998" y="580" font-size="13.5" fill="#7f939c">same image digest — only the configuration differs</text><line x1="1364" y1="654" x2="1733" y2="654" stroke="#60a5fa" stroke-width="2.4" marker-end="url(#ablue)"></line><text x="1368" y="627" font-size="17" font-weight="600" fill="#dce6ea">
            <tspan font-size="12.5" font-weight="800" fill="#5d7079">05</tspan>
            <tspan dx="12">OTLP request traces</tspan></text><text x="1394" y="646" font-size="13.5" fill="#7f939c">service.version = commit SHA · http.route = /balances</text><line x1="968" y1="720" x2="1733" y2="720" stroke="#60a5fa" stroke-width="2.4" marker-end="url(#ablue)"></line><text x="972" y="693" font-size="17" font-weight="600" fill="#dce6ea">
            <tspan font-size="12.5" font-weight="800" fill="#5d7079">06</tspan>
            <tspan dx="12">OTLP traces, metrics and logs for GreenLight itself</tspan></text><text x="998" y="712" font-size="13.5" fill="#7f939c">logs carry commit_sha · five custom greenlight.* instruments</text><line x1="968" y1="868" x2="1733" y2="868" stroke="#f472b6" stroke-width="2.4" marker-end="url(#apink)"></line><text x="972" y="841" font-size="17" font-weight="600" fill="#dce6ea">
            <tspan font-size="12.5" font-weight="800" fill="#5d7079">07</tspan>
            <tspan dx="12">Query Builder v5 — count, p90, p95, error rate</tspan></text><text x="998" y="860" font-size="13.5" fill="#7f939c">one query per window, scoped to a single immutable version</text><line x1="1736" y1="934" x2="971" y2="934" stroke="#f472b6" stroke-width="2.4" stroke-dasharray="9 5" marker-end="url(#apink)"></line><text x="975" y="907" font-size="17" font-weight="600" fill="#dce6ea">
            <tspan font-size="12.5" font-weight="800" fill="#5d7079">08</tspan>
            <tspan dx="12">1.44 ms baseline  →  10.45 ms candidate</tspan></text><text x="1001" y="926" font-size="13.5" fill="#7f939c">257 and 260 spans — both above the 200-span floor</text><line x1="968" y1="1000" x2="1733" y2="1000" stroke="#f472b6" stroke-width="2.4" marker-end="url(#apink)"></line><text x="972" y="973" font-size="17" font-weight="600" fill="#dce6ea">
            <tspan font-size="12.5" font-weight="800" fill="#5d7079">09</tspan>
            <tspan dx="12">SigNoz MCP — the same question, agent-native</tspan></text><text x="998" y="992" font-size="13.5" fill="#7f939c">streamable HTTP, with no direct-query fallback</text><line x1="1736" y1="1066" x2="971" y2="1066" stroke="#f472b6" stroke-width="2.4" stroke-dasharray="9 5" marker-end="url(#apink)"></line><text x="975" y="1039" font-size="17" font-weight="600" fill="#dce6ea">
            <tspan font-size="12.5" font-weight="800" fill="#5d7079">10</tspan>
            <tspan dx="12">corroborating p95 pair + three slowest traces</tspan></text><text x="1001" y="1058" font-size="13.5" fill="#7f939c">every cited trace ID must still resolve, or the check fails</text><line x1="1736" y1="1132" x2="971" y2="1132" stroke="#f472b6" stroke-width="2.4" stroke-dasharray="9 5" marker-end="url(#apink)"></line><text x="975" y="1105" font-size="17" font-weight="600" fill="#dce6ea">
            <tspan font-size="12.5" font-weight="800" fill="#5d7079">11</tspan>
            <tspan dx="12">p95 alert rule fires, then resolves</tspan></text><text x="1001" y="1124" font-size="13.5" fill="#7f939c">version-agnostic — it follows whatever is deployed now</text>
<path d="M962 1198 h62 a11 11 0 0 1 11 11 v12 a11 11 0 0 1 -11 11 h-56" fill="none" stroke="#f472b6" stroke-width="2.4" marker-end="url(#apink)"></path>
<text x="1062" y="1215" font-size="17.5" font-weight="700" fill="#f9a8d4">verdict: regressed · recovery verified · evidence receipt</text>
<text x="1062" y="1239" font-size="13.5" fill="#7f939c">correlation, never causation — and missing evidence stays visibly missing</text><line x1="62" y1="1282" x2="1858" y2="1282" stroke="#18242b"></line><line x1="70" y1="1311" x2="104" y2="1311" stroke="#34d399" stroke-width="3"></line>
