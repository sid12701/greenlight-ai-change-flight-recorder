name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Actions are pinned by commit SHA. A mutable tag lets a third party change
# what runs in CI without any change landing in this repository.
env:
  NODE_VERSION: "24"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run quality
      - run: npm run validate:config
      - run: npm run validate:planning
      - run: npm run validate:telemetry
      - run: npm run validate:signoz-stack
      - run: npm run validate:signoz-assets
      - name: Validate the generated local demo topology
        run: |
          cp .env.demo.example .env.demo
          node scripts/demo-config.mjs secrets
          docker compose \
            --env-file deploy/signoz-images.env \
            --env-file .workloads/greenlight.env \
            -f deploy/compose.local.yaml \
            config --quiet
      - run: git diff --check

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run test:coverage
      - run: npm run test:compiled-migrations
      - run: npm run test:compiled-start
      - run: bash instrumentation/git-hooks/test.sh
      - name: Fail if a test wrote a database into the workspace
        run: |
          if git status --porcelain | grep -E '\.db(-wal|-shm)?$'; then
            echo "A test wrote a database into the workspace" >&2
            exit 1
          fi

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:smoke

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Reject high or critical findings in the full development tree
        run: npm audit --audit-level=high
      - name: Require a clean production dependency tree
        run: npm audit --omit=dev --audit-level=low
      - name: Generate the production dependency SBOM
        run: npm sbom --omit=dev --sbom-format=cyclonedx > greenlight-production.cdx.json
      - name: Fail if the built web bundle contains a credential
        run: |
          npm run build --workspace @greenlight/shared
          npm run build --workspace @greenlight/web
          if grep -rEq '(Bearer [A-Za-z0-9._-]{20,}|gh[pousr]_[A-Za-z0-9]{16,})' apps/web/dist/assets; then
            echo "A credential was compiled into the public web bundle" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: greenlight-sbom
          path: greenlight-production.cdx.json

  images:
    runs-on: ubuntu-latest
    needs: [quality, verify, security]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: docker build -f deploy/api.Dockerfile -t greenlight-api:${{ github.sha }} .
      - run: docker build -f deploy/worker.Dockerfile -t greenlight-worker:${{ github.sha }} .
      - run: docker build -f deploy/web.Dockerfile -t greenlight-web:${{ github.sha }} .
      - name: Require non-root runtime users
        run: |
          test "$(docker image inspect greenlight-api:${{ github.sha }} --format '{{.Config.User}}')" = "65532"
          test "$(docker image inspect greenlight-worker:${{ github.sha }} --format '{{.Config.User}}')" = "65532"
          test "$(docker image inspect greenlight-web:${{ github.sha }} --format '{{.Config.User}}')" = "101"
      - name: Require workspace-scoped runtime dependencies
        run: bash scripts/runtime-image-contract.sh greenlight-api:${{ github.sha }} greenlight-worker:${{ github.sha }} greenlight-web:${{ github.sha }}
      - name: Scan API image for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: greenlight-api:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Scan worker image for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: greenlight-worker:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Scan Web image for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: greenlight-web:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"

  workload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify the public workload contract
        run: node --test integrations/blnk/workload.test.mjs
      - name: Fetch and verify the exact public Blnk release
        run: bash integrations/blnk/fetch.sh
      - name: Validate the health-gated workload model
        env:
          BLNK_DEMO_KEY: ci-only-not-a-runtime-secret
        run: docker compose -f integrations/blnk/compose.yaml config --quiet
      - name: Build the pinned non-root workload image
        env:
          BLNK_DEMO_KEY: ci-only-not-a-runtime-secret
        run: docker compose -f integrations/blnk/compose.yaml build blnk-server

  required:
    if: always()
    runs-on: ubuntu-latest
    needs: [quality, verify, browser, security, images, workload]
    steps:
      - name: Require every gate
        run: |
          test '${{ needs.quality.result }}' = success
          test '${{ needs.verify.result }}' = success
          test '${{ needs.browser.result }}' = success
          test '${{ needs.security.result }}' = success
          test '${{ needs.images.result }}' = success
          test '${{ needs.workload.result }}' = success
