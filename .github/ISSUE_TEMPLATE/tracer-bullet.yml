name: Tracer bullet
description: One narrow, testable vertical implementation slice
title: "[GL-PX-TXX] "
labels:
  - priority:p0
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What observable result does this slice deliver?
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: List blocking issue IDs.
  - type: textarea
    id: tests
    attributes:
      label: Test-first contract
      description: State the failing test, passing behavior, and regression gates.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Use verifiable checkboxes.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Commands, screenshots, trace IDs, or API output required to close.
