name: greenlight

services:
  postgres:
    image: ${SIGNOZ_POSTGRES_IMAGE:?Load deploy/signoz-images.env}
    environment:
      POSTGRES_DB: greenlight
      POSTGRES_USER: greenlight
      POSTGRES_PASSWORD: ${GREENLIGHT_POSTGRES_PASSWORD:?Run npm run demo:up to generate local secrets}
    volumes:
      - greenlight-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greenlight -d greenlight"]
      interval: 3s
      timeout: 3s
      retries: 30
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    image: greenlight-api:0.1.0
    command: ["node", "apps/api/dist/server.js"]
    env_file:
      - ../.env.demo
      - ../.workloads/greenlight.env
    environment:
      GREENLIGHT_HOST: 0.0.0.0
      GREENLIGHT_DATABASE_URL: postgres://greenlight:${GREENLIGHT_POSTGRES_PASSWORD}@postgres:5432/greenlight
      SIGNOZ_URL: http://host.docker.internal:8080
      SIGNOZ_MCP_URL: http://host.docker.internal:8000/mcp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://host.docker.internal:4318
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "127.0.0.1:4000:4000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/readyz').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M

  worker:
    build:
      context: ..
      dockerfile: deploy/worker.Dockerfile
    image: greenlight-worker:0.1.0
    command: ["node", "apps/api/dist/worker.js"]
    env_file:
      - ../.env.demo
      - ../.workloads/greenlight.env
    environment:
      GREENLIGHT_DATABASE_URL: postgres://greenlight:${GREENLIGHT_POSTGRES_PASSWORD}@postgres:5432/greenlight
      SIGNOZ_URL: http://host.docker.internal:8080
      SIGNOZ_MCP_URL: http://host.docker.internal:8000/mcp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://host.docker.internal:4318
      OTEL_SERVICE_NAME: greenlight-worker
    extra_hosts:
      - host.docker.internal:host-gateway
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    image: greenlight-web:0.1.0
    ports:
      - "127.0.0.1:4173:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=16m
      - /var/run:size=4m
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          memory: 32M

volumes:
  greenlight-postgres: {}
