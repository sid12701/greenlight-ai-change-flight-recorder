services:
  ingester:
    image: ${SIGNOZ_OTEL_COLLECTOR_IMAGE:?Set the pinned signoz-otel-collector image by digest}
    # Foundry's generated OpAMP manager creates a new random agent identity on
    # each container recreation. SigNoz cannot bind that identity to an
    # organization non-interactively, leaving OTLP ports open but unusable.
    # The generated ingester.yaml is a complete official collector pipeline, so
    # local/CI use the supported deterministic static-config mode instead.
    command: !override
      - -c
      - |
        /signoz-otel-collector migrate sync check &&
        /signoz-otel-collector --config=/etc/otel-collector-config.yaml
    ports: !override
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  signoz-mcp:
    image: ${SIGNOZ_MCP_IMAGE:?Set the pinned signoz-mcp-server image by digest}
    ports: !override
      - "127.0.0.1:8000:8000"
    depends_on:
      signoz-signoz-0:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  signoz-metastore-postgres-0:
    image: ${SIGNOZ_POSTGRES_IMAGE:?Set the pinned PostgreSQL image by digest}
    environment: !override
      POSTGRES_DB: signoz
      POSTGRES_USER: signoz
      POSTGRES_PASSWORD: ${SIGNOZ_POSTGRES_PASSWORD:?Set SIGNOZ_POSTGRES_PASSWORD through a secret source}
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  signoz-signoz-0:
    image: ${SIGNOZ_IMAGE:?Set the pinned SigNoz image by digest}
    environment: !override
      SIGNOZ_SQLSTORE_PROVIDER: postgres
      SIGNOZ_SQLSTORE_POSTGRES_DSN: postgres://signoz:${SIGNOZ_POSTGRES_PASSWORD}@signoz-metastore-postgres-0:5432/signoz?sslmode=disable
      SIGNOZ_TELEMETRYSTORE_PROVIDER: clickhouse
      SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN: tcp://signoz-telemetrystore-clickhouse-0-0:9000
      SIGNOZ_TOKENIZER_JWT_SECRET: ${SIGNOZ_TOKENIZER_JWT_SECRET:?Set SIGNOZ_TOKENIZER_JWT_SECRET through a secret source}
      SIGNOZ_USER_ROOT_ENABLED: "true"
      SIGNOZ_USER_ROOT_EMAIL: ${SIGNOZ_BOOTSTRAP_EMAIL:?Set SIGNOZ_BOOTSTRAP_EMAIL through a secret source}
      SIGNOZ_USER_ROOT_PASSWORD: ${SIGNOZ_BOOTSTRAP_PASSWORD:?Set SIGNOZ_BOOTSTRAP_PASSWORD through a secret source}
      SIGNOZ_USER_ROOT_ORG_NAME: ${SIGNOZ_BOOTSTRAP_ORG_NAME:-greenlight-demo}
    ports: !override
      - "127.0.0.1:8080:8080"
    depends_on:
      signoz-metastore-postgres-0:
        condition: service_healthy
      signoz-telemetrystore-clickhouse-0-0:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  signoz-telemetrykeeper-clickhousekeeper-0:
    image: ${SIGNOZ_CLICKHOUSE_KEEPER_IMAGE:?Set the pinned ClickHouse Keeper image by digest}
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  signoz-telemetrystore-clickhouse-0-0:
    image: ${SIGNOZ_CLICKHOUSE_IMAGE:?Set the pinned ClickHouse image by digest}
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G

  signoz-telemetrystore-clickhouse-user-scripts:
    image: ${SIGNOZ_CLICKHOUSE_IMAGE:?Set the pinned ClickHouse image by digest}

  signoz-telemetrystore-migrator:
    image: ${SIGNOZ_OTEL_COLLECTOR_IMAGE:?Set the pinned signoz-otel-collector image by digest}
